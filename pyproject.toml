[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-council"
version = "0.1.0"
description = "Local, auditable, extensible multi-role investment research workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "pandas>=3,<4",
  "pydantic>=2.8,<3",
  "pyarrow>=20,<30",
  "PyYAML>=6,<7",
]

[project.scripts]
trade-council = "trade_council.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/trade_council/engineering/datapack.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["src/trade_council/engineering/datapack.py"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*", "pyarrow", "pyarrow.*", "yaml"]
ignore_missing_imports = true
follow_imports = "skip"

# datapack.py 是 Stage 0 遗留过程式脚本（约 1.6k 行，主流程 build 单函数近 900 行），
# 已在 ruff/mypy 的 exclude 中排除，但被 cli.py import 后仍会被跟查。
# 这里只豁免「未标注」类检查，保留泛型与赋值兼容性等真实类型检查；
# 补齐完整标注属于独立重构项，不阻塞 v1.0 验收。
[[tool.mypy.overrides]]
module = ["trade_council.engineering.datapack"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
